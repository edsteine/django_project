<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>

    <!-- External fonts for modern design -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Basic CSS for layout and style -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffeb3b;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column;
        }

        h1 {
            font-size: 4rem;
            color: #d32f2f;
            font-weight: 600;
        }

        p {
            font-size: 1.2rem;
            color: #333;
            margin-top: 10px;
        }

        .quote {
            font-size: 1.5rem;
            color: #555;
            margin-top: 30px;
            font-style: italic;
        }

        .button {
            text-decoration: none;
            color: #fff;
            background-color: #388e3c;
            padding: 12px 24px;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #2c6b2f;
        }

        footer {
            font-size: 0.9rem;
            color: #888;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <h1>Oops! Page Not Found</h1>
    <p>Looks like you took a wrong turn!</p>

    <div class="quote">
        "I wonder if the 404 page gets lonely, being all by itself."
    </div>

    <a href="/" class="button">Go Back Home</a>

    <footer>
        <p>&copy; 2024 Ed Project. All Rights Reserved.</p>
    </footer>

</body>

</html>
