[build-system]
requires = ["poetry>=1.8.5"]
build-backend = "poetry.core.masonry.api"

[tool.hatch.build.targets.wheel]
packages = ["ed_project"]

[tool.hatch.build]
sources = ["."]

[tool.hatch.metadata]
allow-direct-references = true

# [project]
# name = "ed_project"
# version = "0.1.0"
# description = "Project description"
# authors = [{ name = "Adil AJDAA", email = "a.ajdaa@outlook.com" }]
# requires-python = ">=3.8,<3.14" # More flexible version range
# license = { text = "MIT" }
[tool.poetry]
name = "ed_project"
version = "0.1.0"
description = "Project description"
authors = ["Adil AJDAA <a.ajdaa@outlook.com>"]
license = "MIT"
package-mode = false
readme = "README.md"
repository = "https://github.com/yourusername/ed_project"
documentation = "https://ed_project.readthedocs.io"
packages = [{ include = "ed_project" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Programming Language :: Python :: 3.13",
]
[tool.poetry.dependencies]
python = ">=3.13,<4.0"
"poetry" = ">=1.8.5"
"poetry-plugin-export"=">=1.8.0"
# python = ">=3.10,<4.0"
"Django" = ">=5.1.4"
"djangorestframework" = ">=3.15.2"
"djangorestframework-simplejwt" = ">=5.3.1"
"pillow" = ">=11.0.0"
"django-cryptography" = ">=1.1"
"django-axes" = ">=7.0.1"
"django-password-validators" = ">=1.7.3"
"django-redis" = ">=5.4.0"
"redis" = ">=5.2.1"
"django-environ" = ">=0.11.2"
"python-slugify" = ">=8.0.4"
"structlog" = ">=24.4.0"
"typing-extensions" = ">=4.12.2"
"phonenumbers" = ">=8.13.52"
"django-cors-headers" = ">=4.6.0"
"whitenoise" = ">=6.8.2"
"pip" = ">=24.3.1"
"pip-tools" = ">=7.4.1"
"psycopg2" = ">=2.9.10"
"pre-commit" = ">=4.0.1"
"drf-spectacular" = ">=0.28.0"
"django-silk" = ">=5.3.2"
"django-cachalot" = ">=2.7.0"
"asgiref" = ">=3.8.1"
uvicorn = { version = ">=0.29.0", optional = true }
gunicorn = { version = ">=21.2.0", optional = true }
sentry-sdk = { version = ">=2.1.1", optional = true }
django-health-check = { version = ">=3.18.1", optional = true }
django-prometheus = { version = ">=2.3.1", optional = true }
psutil = { version = ">=5.9.0", optional = true }

[tool.poetry.dev-dependencies]
# [tool.poetry.group.dev.dependencies]
pytest-asyncio = ">=0.23.5"
pytest-xdist = ">=3.5.0"
pytest-timeout = ">=2.3.1"
coverage = { extras = ["toml"], version = ">=7.4.1" }
# types-all = ">=1.0.0"
"vulture" = ">=2.14"
"ruff" = ">=0.8.4"
"black" = ">=24.10.0"
"mypy" = ">=1.14.0"
"django-stubs" = ">=5.1.1"
"djangorestframework-stubs" = ">=3.15.2"
"django-debug-toolbar" = ">=4.4.6"
"django-extensions" = ">=3.2.3"
"ipython" = ">=8.31.0"
"rich" = ">=13.9.4"
"drf-yasg" = ">=1.21.8"
"pip-audit" = ">=2.7.3"
"bandit" = ">=1.8.0"
"pytest" = ">=8.3.4"
"pytest-django" = ">=4.9.0"
"pytest-mock" = ">=3.14.0"
"pytest-cov" = ">=6.0.0"
"factory-boy" = ">=3.3.1"
"faker" = ">=33.1.0"
"freezegun" = ">=1.5.1"
"safety" = ">=3.2.14"
"django-defender" = ">=0.9.8"
pylint = "^3.3.2"
dotenv-linter = ">=0.5.0"
# typing =">=3.10.0"
[tool.poetry.extras]
prod = [
    "uvicorn",
    "gunicorn",
    "sentry-sdk",
    "django-health-check",
    "django-prometheus",
    "psutil",
]


# [tool.poetry.group.docs]
# optional = true
