#     "mkdocs-material" = ">=9.5.12"
#     "mkdocstrings" = [
#         extras = ["python"]
#         version = ">=0.24.0"]
# ]
# [tool.poetry.group.monitoring]
# optional = true
# dependencies = [
#     prometheus-client = ">=0.19.0"
#     "elastic-apm" = ">=6.21.3.0"
# ]
[tool.ruff]
line-length = 140
target-version = "py313"
exclude = ["*/migrations/*", "tests/", "docs/*", "build/*", "dist/*"]
fix = true
respect-gitignore = true
src = ["ed_project"]
indent-width = 4
unsafe-fixes = false
cache-dir = ".ruff_cache"
[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = [

    # "ALL",  # Enable all rules
    "FURB", # refurb
    "LOG",  # flake8-logging
    "TD",   # flake8-todos
    # Basic Code Validation
    "F", # pyflakes (basic code errors)
    "E", # pycodestyle errors (syntax and style)
    "B", # flake8-bugbear (advanced bug detection)

    # # Import and Structure
    "I",   # isort (import sorting)
    "ICN", # flake8-import-conventions
    "TID", # flake8-tidy-imports

    # # Code Improvements
    "UP",  # pyupgrade (modernize code)
    "SIM", # flake8-simplify
    "C",   # mccabe complexity
    "N",   # pep8-naming conventions

    # # Security and Potential Errors
    "A",   # flake8-builtins
    "S",   # flake8-bandit (security)
    "ERA", # eradicate (remove commented code)

    # # Type Checking and Annotations
    "ANN", # flake8-annotations

    # # Framework and Environment Specific
    "DJ",    # flake8-django
    "ASYNC", # flake8-async

    # # Specific Checks
    # "ARG",   # flake8-unused-arguments
    "T",   # flake8-print (discourage print statements)
    "RSE", # flake8-raise (exception handling)
    "DTZ", # flake8-datetimez
    "PT",  # flake8-pytest-style

    # # Formatting and Style
    "Q",   # flake8-quotes
    "COM", # flake8-commas

    # # Specific Rule Sets
    "PL",  # pylint
    "RUF", # ruff-specific rules

    # # Documentation (typically last)
    # "D",     # pydocstyle (docstring conventions)
]
ignore = [
    "COM812",
    "ERA001", # Found commented-out code

]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
lines-between-types = 1
known-third-party = ["django", "rest_framework"]


[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG"]
"__init__.py" = ["F401"]

# Add this section for dotenv configuration


[tool.mypy]
python_version = "3.13"
strict = true
namespace_packages = true
mypy_path = "stubs"
explicit_package_bases = true
follow_imports = "normal"
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = false
warn_unused_configs = true
warn_return_any = true
show_error_codes = true
implicit_reexport = false
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
check_untyped_defs = true
# exclude = ["tests", ",migrations"]
exclude = '^(tests|migrations|\.mypy_cache|\.env).*'
files = ["ed_project"]

[tool.django-stubs]
django_settings_module = "config_project.settings.dev_config"
# [tool.pytest]
# DJANGO_SETTINGS_MODULE = "config_project.settings.dev_config"
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config_project.settings.dev_config"
pythonpath = [".", "ed_project"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python = "^3.13"
pytest = "^8.3.4"
pytest-randomly = "^3.16.0"
pytest-sugar = "^1.0.0"
django_find_project = false
requirements = [
    "pytest-randomly", # Randomize test order
    "pytest-sugar",    # Improved test output
]
addopts = [
    "--cov=api",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--no-cov-on-fail",
    "--strict-markers",
    "-ra",
    # "--strict-config",
    "--cov=ed_project",
    "--cov-report=html:htmlcov",
    "--durations=10",
    "-v",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration",
    "docker: marks tests requiring docker",
    "unit: marks unit tests",
    "api: marks API tests",
    "db: marks database tests",
    "unit: marks unit tests",
    "e2e: marks end-to-end tests"
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]


[tool.coverage.run]
branch = true
source = ["ed_project"]
omit = [
    "tests/*",
    "*/migrations/*",
    "*/admin.py",
    "*/__init__.py",
    "manage.py",
    "config_project/asgi.py",
    "config_project/wsgi.py",
    "config_project/settings/*",
]
[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101"]                       # Skip assert used as test statements


[tool.vulture]
exclude = ["api/", "tests/"]
ignore_decorators = ["tests*", "@require_*"]
ignore_names = ["visit_*", "do_*"]
make_whitelist = true
min_confidence = 80
paths = ["."]
sort_by_size = true
verbose = true


[tool.pylint]
# Optional: configure your specific settings here
max-line-length = 140
disable = [
    "C0114",
    "C0115",
    "C0116",
    "C0415",
    "C0103",
    "W0621",
    "W0107",
    "R0903",
    "E1101",
    "E0307",
    "C0325",
    "W0613",
    "C0411",
    "E1101",
    "R0901",
    "R0904",
    "E1136",
    "R0801",
    "R0801",
    "E1101",
    "E1101",
    "W1503",
    "",
    "",
    "",
    "",
    "",
    "",
] # Disable specific warnings (like missing docstrings)
enable = ["E1101"] # Enable specific warnings
good-names = ["i", "j", "k", "ex", "Run", "sys"] # Allow these variable names
